<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mutirão do Cimento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a1a3a;
    --surface: #10234d;
    --surface-2: #1a3060;
    --cement: #c7d2e8;
    --cement-dim: #7d8db0;
    --gold: #d9a441;
    --gold-dim: #b8862f;
    --cream: #ffffff;
    --radius: 6px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 20% -10%, #16305f 0%, transparent 55%),
      radial-gradient(ellipse at 90% 10%, #0d1f45 0%, transparent 45%),
      var(--bg);
    color:var(--cream);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:56px 20px 40px;
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:14px;
  }
  h1{
    font-family:'Bebas Neue', sans-serif;
    font-weight:400;
    font-size:clamp(42px, 9vw, 76px);
    letter-spacing:.02em;
    line-height:.92;
    margin:0 0 14px;
    text-align:center;
    color:var(--cream);
  }
  h1 span{color:var(--gold);}
  .sub{
    max-width:480px;
    text-align:center;
    color:var(--cement);
    font-size:15px;
    line-height:1.55;
    margin:0 0 44px;
  }
  .sub strong{color:var(--cream);font-weight:600;}
  .stats{
    font-family:'JetBrains Mono', monospace;
    text-align:center;
    margin-bottom:22px;
  }
  .stats .primary{
    font-size:clamp(30px,7vw,44px);
    font-weight:700;
    color:var(--cream);
  }
  .stats .primary small{
    font-size:16px;
    font-weight:500;
    color:var(--cement);
  }
  .bar-wrap{
    width:100%;
    max-width:420px;
  }
  .bar-track{
    position:relative;
    width:100%;
    height:22px;
    background:var(--surface-2);
    border:1px solid var(--cement-dim);
    border-radius:11px;
    overflow:hidden;
  }
  .bar-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg, var(--gold-dim), var(--gold));
    border-radius:11px 0 0 11px;
    transition:width 900ms cubic-bezier(.22,.8,.28,1);
  }
  .bar-labels{
    display:flex;
    justify-content:space-between;
    margin-top:8px;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--cement-dim);
  }
  .bar-labels #pctText{color:var(--gold);font-weight:700;}
  .cta{
    margin-top:38px;
    display:inline-block;
    background:var(--gold);
    color:var(--bg);
    text-decoration:none;
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    font-size:15px;
    padding:15px 34px;
    border-radius:var(--radius);
    letter-spacing:.01em;
    box-shadow:0 4px 0 var(--gold-dim);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .cta:hover{transform:translateY(2px);box-shadow:0 2px 0 var(--gold-dim);}
  .foot{
    margin-top:56px;
    font-size:12px;
    color:var(--cement-dim);
    text-align:center;
  }
</style>
</head>
<body>
  <div class="eyebrow">Campanha de construção</div>
  <h1>1.200 <span>sacos</span><br>de cimento</h1>
  <p class="sub">Toda doação, de qualquer valor, vira sacos de cimento — e cada saco levanta um pouco mais da nossa igreja.</p>
  <div class="stats">
    <div class="primary"><span id="bagsDonated">0</span> <small>/ 1.200 sacos</small></div>
  </div>
  <div class="bar-wrap">
    <div class="bar-track">
      <div id="barFill" class="bar-fill"></div>
    </div>
    <div class="bar-labels">
      <span>0 sacos</span>
      <span id="pctText">0%</span>
      <span>1.200 sacos</span>
    </div>
  </div>
  <a class="cta" href="https://web.inchurch.com.br/doacoes/9949?t=eyJhcHBfaWQiOiAiYnIuY29tLmluY2h1cmNoLmlibWlyYW1hciIsICJ0ZXJ0aWFyeWdyb3VwX2lkIjogMzUzMTh9" id="donateLink">Fazer uma doação</a>
  <div class="foot">Doações processadas pelo app da igreja.<br>Atualizado automaticamente.</div>
<script>
  const GOAL_BAGS = 1200;
  // Cole aqui o link da aba "Total" publicada como CSV (Arquivo → Compartilhar →
  // Publicar na web → selecionar a aba "Total" → formato CSV).
  const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQrDo51LK2ujkJp2WmqvilVq_cm6msu8kIlpH8sV7BMKODAIqM3qx1NxdzbTIGV6Q/pub?gid=1260103814&single=true&output=csv';
  const barFill = document.getElementById('barFill');
  const pctText = document.getElementById('pctText');
  const bagsEl = document.getElementById('bagsDonated');
  function render(bags){
    const clamped = Math.max(0, Math.min(GOAL_BAGS, bags));
    const pct = clamped / GOAL_BAGS;
    barFill.style.width = (pct * 100) + '%';
    pctText.textContent = Math.round(pct * 100) + '%';
    bagsEl.textContent = clamped.toLocaleString('pt-BR');
  }
  async function refresh(){
    if (!SHEET_CSV_URL){
      console.warn('SHEET_CSV_URL não configurado ainda.');
      return;
    }
    try{
      const res = await fetch(SHEET_CSV_URL);
      const text = await res.text();
      // Pega o primeiro número que aparecer no CSV publicado (a célula B1 da aba "Total").
      const match = text.replace(/[",]/g, '').match(/-?\d+(\.\d+)?/);
      render(match ? Math.floor(Number(match[0])) : 0);
    }catch(e){
      console.error('Falha ao buscar dados da planilha', e);
    }
  }
  refresh();
  setInterval(refresh, 60000); // reconsulta a planilha a cada 60s
</script>
</body>
</html>
